# 国企七大高频题材 · 负向表达 → 正向话术模板库
# 用于 SOE Reframer：输入吐槽/事故/甩锅，按题材匹配，输出可汇报、可留痕、可邀功的国企表达

version: "1.0"
source: 国企工作报告、领导讲话、巡视整改、述职报告、复盘会纪要

themes:

  # ============ 题材一：风险防控 / 底线思维 ============
  risk_control:
    tags: [硬件故障, 系统宕机, 安全事故, 风险, 隐患, 不可抗力]
    negative_examples:
      - "硬件坏了，是天灾，不是我的锅"
      - "谁牵头谁担责，这明明是硬件故障的不可抗力"
      - "出事了再说，平时哪顾得上"
    positive_template: |
      我们坚持底线思维、极限思维、关联思维，主动将 {风险事项} 纳入风险防控清单，
      通过 {冗余部署/定期演练/分级管控/隐患排查}，把“不可抗力”变为“可控变量”。
      此次事件虽 {造成一定影响}，但影响可控、处置有序，恰好验证了前期风险研判的准确性，
      也为进一步完善 {三道防线/双重预防机制} 提供了实战依据。
      以实战促完善，以制度筑防线，发展的路才能越走越稳、越走越宽。
    keywords: [底线思维, 极限思维, 风险防控清单, 三道防线, 分级管控, 早发现早预警早处置, 可控变量, 行稳致远]

  # ============ 题材二：数据治理 / 网络安全 ============
  data_governance:
    tags: [资料没了, 数据丢失, 档案混乱, 数据泄露, 备份]
    negative_examples:
      - "资料没了，责任就没了"
      - "历史档案乱七八糟，根本找不到"
      - "数据丢了，恢复不回来"
    positive_template: |
      在集团合规管理框架下，我们主动开展历史资料的系统性梳理与精简，
      有效降低冗余信息带来的管理风险。以“瘦身健体”促“提质增效”，
      推动数据标准化、规范化、资产化，让每一份留存都经得起巡视审计检验。
      同时以此次事件为契机，进一步强化异地备份与容灾能力，
      实现从“单点存储”到“穿透式监管、全级次全链条全要素闭环”的跃升。
    keywords: [瘦身健体, 提质增效, 数据资产化, 司库体系, 账户可视资金可溯归集可控, 穿透式监管, 异地备份, 容灾, 经得起检验]

  # ============ 题材三：降本增效 / 亏损治理 ============
  cost_reduction:
    tags: [亏损, 赔钱, 浪费, 成本, 包袱, 裁员, 压减]
    negative_examples:
      - "一直在亏，没救了"
      - "部门冗余，人浮于事"
      - "钱都打了水漂"
    positive_template: |
      我们牢固树立“一切成本皆可控”的理念，坚持向管理要效益、向技术要效益、向效率要利润。
      通过压降“两金”占用、修旧利废、堵塞跑冒滴漏，坚决止住“出血点”；
      通过压减管理层级、剥离非主业非优势业务、盘活存量资产，不断增强自身“造血功能”。
      以“过紧日子”换取“拼好日子”，推动资产运营质效双升。
    keywords: [一切成本皆可控, 向管理要效益, 压降两金, 修旧利废, 跑冒滴漏, 过紧日子拼好日子, 瘦身健体, 提质增效, 造血功能]

  # ============ 题材四：合规 / 依法治企 ============
  compliance:
    tags: [违规, 被审计, 被巡视, 处罚, 整改, 问责]
    negative_examples:
      - "被审计指出一堆问题"
      - "这次要被问责了"
      - "制度形同虚设"
    positive_template: |
      我们坚持以巡促改、以审促治，把整改成效转化为制度成果、治理效能。
      对反馈问题实行清单化、闭环式、销号制管理，做到当下改与长久立相统一；
      同步完善“三重一大”决策机制，强化规章制度、经济合同、重要决策法律审核，
      发挥首席合规官与总法律顾问作用，实现依靠制度管人、管事、管权。
      举一反三、标本兼治，让每一次整改都成为治理体系进化升级的契机。
    keywords: [以巡促改以审促治, 举一反三, 标本兼治, 闭环整改, 销号管理, 三重一大, 三项审核, 首席合规官, 管人管事管权]

  # ============ 题材五：改革 / 治理现代化 ============
  reform:
    tags: [改革, 重组, 整合, 三项制度, 末等调整, 授权]
    negative_examples:
      - "改革改不动，阻力太大"
      - "人难退、干部难下"
      - "授权了但没人敢接"
    positive_template: |
      我们扎实推进国企改革深化提升行动，以三项制度改革为突破口，
      落实经理层任期制与契约化管理，畅通“末等调整、不胜任退出”通道，
      真正实现干部能上能下、员工能进能出、收入能增能减。
      通过专业化整合与战略性重组，推动资源向优势主业集中；
      通过科学授权放权，做到“接得住、用得好”，激发各层级活力。
    keywords: [改革深化提升行动, 三项制度改革, 任期制契约化, 末等调整不胜任退出, 专业化整合, 战略性重组, 授权放权, 接得住用得好]

  # ============ 题材六：党建 / 担当 ============
  party_building:
    tags: [党建, 担当, 冲锋, 加班, 急难险重, 责任]
    negative_examples:
      - "又是党员上，凭什么"
      - "急难险重全压给我们"
      - "守土有责说得轻巧"
    positive_template: |
      我们始终坚持“两个一以贯之”，推动党建与业务双融双促，
      让党建成为企业发展的“根”和“魂”。
      在急难险重任务面前，党员责任区、先锋岗、突击队冲锋在前，
      以“时时放心不下”的责任感和“守土有责、守土尽责”的担当，
      把“国之大者”转化为看得见的攻坚成果。
    keywords: [两个一以贯之, 根和魂, 双融双促, 党员责任区先锋岗突击队, 国之大者, 时时放心不下, 守土有责守土尽责, 冲锋在前]

  # ============ 题材七：事故复盘 / 故障转正 ============
  incident_review:
    tags: [事故, 故障, 宕机, 停产, 损失, 复盘]
    negative_examples:
      - "这次事故暴露了管理漏洞"
      - "预案根本没用"
      - "演练都是走过场"
    positive_template: |
      此次 {事件} 虽造成 {具体影响}，但我们坚持“问题不过夜、复盘不走过场”，
      以实战代替演练，用真实情况检验预案成色与防控体系的有效性。
      经此一役，我们进一步固化形成 {长效机制/制度规范/操作规程}，
      实现从“被动应对”到“主动防控”的体系跃升。
      把功夫下在平时，把防线筑在事前，关键时刻才能顶得上、扛得住。
    keywords: [问题不过夜复盘不走过场, 以实战代替演练, 检验成色, 体系跃升, 长效机制, 顶得上扛得住, 功夫下在平时]
