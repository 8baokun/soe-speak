# 负向 → 正向 词库映射

negative_to_positive:
  推卸责任: [制度管人, 流程管事, 权责清晰, 责任到人]
  甩锅: [不回避, 不推诿, 主动担当, 牵头即负责]
  不可抗力: [客观突发情况, 风险防控清单, 底线思维]
  预判失误: [以实战代替演练, 真实验收, 验证成色]
  数据丢失: [灾备加固, 容灾能力, 影响可控, 恢复有序]
  资料没了: [系统性梳理, 瘦身健体, 经得起检验, 档案优化]
  谁牵头谁担责: [牵头即负责, 负责必到底, 使命担当]
  硬件故障: [冗余部署, 定期演练, 全生命周期管理, 设备巡检]
  吐槽抱怨: [问题导向, 举一反三, 销号落实, 解题建议]
  事故: [实战检验, 风控验证, 体系升级契机]
  损失: [影响可控, 最小化, 转化契机]
  演练: [实战检验, 真实情况, 成色验收]

# 官话 → 人话（反向模式）
official_to_plain:
  原则上同意: 可以，但别出事
  再研究研究: 先放着
  一岗双责: 出事你俩都得担
  留痕管理: 聊天记录别删
  你牵头一下: 活你干、锅你背
  四不两直: 我要突然来检查
  后半篇文章: 别只顾开头，收尾也要漂亮
  举一反三: 一件事没做好，全公司陪着改
  销号落实: 逐条清零，不留尾巴
  一岗双责: 管业务也要管廉政
  三重一大: 大额资金/重要人事/重大项目/重大决策，必须上会
  两个责任: 党委主体责任 + 纪委监督责任

# 升华金句库
epilogues:
  - 只有把功夫下在平时，关键时刻才能顶得上、扛得住。
  - 规矩立得住，路才能越走越宽。
  - 让每一份留存都经得起检验，让每一步发展都行稳致远。
  - 以预判赢主动，以制度保安全。
  - 功夫下在平时，防线筑在事前。
  - 以实战促完善，以制度筑防线。
  - 从“点上整改”到“面上提升”。
  - 把问题清单转化为制度清单、成果清单。

